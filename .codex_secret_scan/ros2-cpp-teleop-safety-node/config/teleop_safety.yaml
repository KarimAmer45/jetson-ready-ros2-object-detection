teleop_safety_node:
  ros__parameters:
    input_topic: /cmd_vel_raw
    output_topic: /cmd_vel
    scan_topic: /scan
    estop_topic: /e_stop
    speed_limit_topic: /speed_limit

    command_timeout: 0.35
    timer_period: 0.05
    publish_zero_on_timeout: true

    max_linear_speed: 0.6
    max_lateral_speed: 0.25
    max_angular_speed: 1.4
    max_linear_accel: 1.0
    max_angular_accel: 2.0
    allow_lateral_motion: false

    obstacle_stop_enabled: true
    min_obstacle_distance: 0.45
    front_arc_degrees: 70.0
